apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: cemp-prod
resources:
- ../../base
patches:
- patch: |-
    - op: replace
      path: /metadata/name
      value: cemp-prod
  target:
    kind: Namespace
    name: placeholder
- patch: |-
    - op: replace
      path: /spec/replicas
      value: 3
  target:
    kind: Deployment
    name: cemp-api
images:
- name: adhivenkatesh7/cemp-api
  newTag: v2-prod