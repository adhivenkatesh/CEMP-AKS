apiVersion: apps/v1
kind: Deployment
metadata:
  name: cemp-api
  namespace: cemp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cemp-api
  template:
    metadata:
      labels:
        app: cemp-api
    spec:
      containers:
      - name: cemp-api
        image: adhivenkatesh7/cemp-api:v2
        imagePullPolicy: Always
        ports:
        - containerPort: 80
          name: http
        envFrom:
        - configMapRef:
            name: cemp-config
        - secretRef:
            name: cemp-secret
        livenessProbe:
          httpGet:
            path: /api/health
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/health
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 5
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
