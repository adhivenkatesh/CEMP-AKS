apiVersion: apps/v1
kind: Deployment
metadata:
  name: mssql
  namespace: cemp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mssql
  template:
    metadata:
      labels:
        app: mssql
    spec:
      containers:
            - name: mssql
        image: mcr.microsoft.com/mssql/server:2022-latest
        ports:
                - containerPort: 1433
        env:
                - name: ACCEPT_EULA
          value: "Y"
                - name: SA_PASSWORD
          valueFrom:
            secretKeyRef:
              name: cemp-secret
              key: SA_PASSWORD
                - name: MSSQL_PID
          value: "Developer"
        volumeMounts:
                - name: mssql-storage
          mountPath: /var/opt/mssql
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: 1000m
            memory: 2Gi
      volumes:
            - name: mssql-storage
              persistentVolumeClaim:
               claimName: mssql-pvc