apiVersion: apps/v1
kind: Deployment
metadata:
  name: cemp-api
  namespace: cemp-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cemp-api
  template:
    metadata:
      labels:
        app: cemp-api
    spec:
      containers:
        - name: cemp-api
          image: cemp-api:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          envFrom:
            - configMapRef:
                name: cemp-config
            - secretRef:
                name: cemp-secret
