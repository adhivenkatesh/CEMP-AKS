name: CEMP Build and Deploy to AKS

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to DockerHub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and Push to DockerHub
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./docker/Dockerfile
        push: true
        tags: |
          adhivenkatesh7/cemp-api:v2
          adhivenkatesh7/cemp-api:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Azure Login
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Set AKS Context
      uses: azure/aks-set-context@v3
      with:
        resource-group: ${{ secrets.AKS_RESOURCE_GROUP }}
        cluster-name: ${{ secrets.AKS_CLUSTER_NAME }}

    - name: Deploy to AKS
      run: |
        kubectl apply -f k8s/aks-new/00-namespace.yaml
        kubectl apply -f k8s/aks-new/01-configmap.yaml
        kubectl apply -f k8s/aks-new/02-secret.yaml
        kubectl apply -f k8s/aks-new/03-deployment.yaml
        kubectl apply -f k8s/aks-new/04-service.yaml
        kubectl apply -f k8s/aks-new/05-ingress-aks.yaml
        kubectl set image deployment/cemp-api cemp-api=adhivenkatesh7/cemp-api:v2 -n cemp
        kubectl rollout status deployment/cemp-api -n cemp --timeout=120s
        kubectl get pods -n cemp
        kubectl get ingress -n cemp