replicaCount: 1

image:
  repository: containerregistrycemp.azurecr.io/cemp-api
  tag: "latest"
  pullPolicy: IfNotPresent

imagePullSecrets:
    - name: acr-secret

serviceAccount:
  create: false

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  className: "nginx"
  annotations: {}
  hosts:
    - host: cemp.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

httpRoute:
  enabled: false

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

autoscaling:
  enabled: false